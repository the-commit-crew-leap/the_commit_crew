services:

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    ports:
      - "0.0.0.0:8082:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars}

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars}

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    working_dir: /app/analytics
    command: ["uvicorn", "src.api_module:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "0.0.0.0:${ANALYTICS_API_PORT:-8090}:8090"
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
      ANALYTICS_CORS_ORIGINS: ${ANALYTICS_CORS_ORIGINS:-http://localhost:8086,http://127.0.0.1:8086}
    volumes:
      - ./analytics:/app/analytics
      - ./analytics/outputs:/app/analytics/outputs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build: 
      context: ./db
      args:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    environment:
    # Use the values from the .env file passed via --env-file flag in Jenkinsfile
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  default:
    name: the-commit-crew_default
    
volumes:
  db_data:
    # Named volume: persists Postgres data across 'docker compose down' and
    # 'docker compose up'. Use 'docker compose down -v' to also remove this
    # volume, which wipes the database and starts fresh on the next 'up'.
