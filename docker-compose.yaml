services:

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    ports:
      - "0.0.0.0:8082:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars}

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-min-32-chars}

  db:
    build: 
      context: .
      dockerfile: db/Dockerfile 
      args:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    environment:
    # Use the values from the .env file passed via --env-file flag in Jenkinsfile
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

zookeeper:
  image: confluentinc/cp-zookeeper:7.5.0
  environment:
    ZOOKEEPER_CLIENT_PORT: 2181

networks:
  default:
    name: the-commit-crew_default
    
volumes:
  db_data:
    # Named volume: persists Postgres data across 'docker compose down' and
    # 'docker compose up'. Use 'docker compose down -v' to also remove this
    # volume, which wipes the database and starts fresh on the next 'up'.
