<section class="dash-shell">
  <div class="workspace">
    <div class="dash-card">
      <h1>Dashboard</h1>

      <section class="account-summary">
        <h2>Account Overview</h2>

        <p *ngIf="balance">
          Account: <strong>{{ balance.accountId }}</strong>
        </p>

        <p *ngIf="balance">
          Cash balance:
          <strong>{{ balance.cashBalance.amount }}</strong>
          {{ balance.cashBalance.currency || '' }}
        </p>

        <p *ngIf="!balance && !balanceError">Loading account balance...</p>
        <p *ngIf="balanceError">Unable to load account balance.</p>
      </section>

      <nav aria-label="Dashboard actions">
        <a routerLink="/orders">My Orders</a>
        <button type="button" (click)="logout()">Log out</button>
      </nav>
    </div>

    <app-order-ticket [balance]="balance"></app-order-ticket>
  </div>
</section>
