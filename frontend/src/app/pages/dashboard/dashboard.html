<section class="dash-shell">
  <div class="workspace">
    <div class="portfolio-column">
      <div class="dash-card">
        <h1>Trading overview</h1>
        <p class="welcome-message">Welcome back. Here's what's in your account.</p>

        <nav aria-label="Dashboard actions">
          <a routerLink="/orders">My Orders</a>

      </div>

      <app-assets></app-assets>
    </div>

    <app-order-ticket [balance]="balance()"></app-order-ticket>
  </div>
</section>
