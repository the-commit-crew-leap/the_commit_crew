<header class="tcc-header">
  <a class="tcc-brand" routerLink="/">
    <span class="tcc-brand-mark" aria-hidden="true"></span>
    <span>The Commit Crew</span>
  </a>
  <nav class="tcc-primary-nav" aria-label="Primary navigation">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      Dashboard
    </a>
    <a routerLink="/orders" routerLinkActive="is-active">
      Orders
    </a>
  </nav>
  <div class="tcc-account-actions">
    <button class="tcc-account-selector" type="button">
      Account
      <span aria-hidden="true">⌄</span>
    </button>

    <button class="tcc-action-button" type="button">
      <span aria-hidden="true">+</span>
      New order
    </button>
  </div>
</header>
