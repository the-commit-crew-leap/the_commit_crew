spring.application.name=the-commit-crew-trading
server.port=8081
management.endpoints.web.exposure.include=health

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/the-commit-crew-dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3d4!}

mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.security.user.name=admin
spring.security.user.password=admin123

logging.level.org.springframework.security=DEBUG