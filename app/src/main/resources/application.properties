spring.application.name=the-commit-crew-trading
server.port=8081
management.endpoints.web.exposure.include=health

# Test Database - PostgreSQL (same as production, but test instance)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/the-commit-crew-dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3d4!}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# MyBatis
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyThatIsLongEnoughForHS256SigningAlgorithm123}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Disable auth for integration tests
auth.enabled=false

logging.level.org.springframework.security=DEBUG

# Kafka topics
trading.kafka.topics.orders=orders
trading.kafka.topics.executions=executions
trading.kafka.partitions=3

# Order republishing (safety net for failed Kafka sends)
trading.orders.republish-interval=30000
trading.orders.republish-after=60000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=the-commit-crew-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
