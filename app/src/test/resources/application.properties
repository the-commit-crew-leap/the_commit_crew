# Test Database - PostgreSQL (same as production, but test instance)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/the-commit-crew-dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:n3u3d4!}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# MyBatis
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:900000}

# Disable auth for integration tests
auth.enabled=false

# Logging
logging.level.org.springframework.security=DEBUG